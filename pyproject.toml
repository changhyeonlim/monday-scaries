[project]
name = "monday-scaries"
version = "0.1.0"
description = "Triage a public GitHub repo's open issues by severity with an LLM."
readme = "README.md"
authors = [
    { name = "changhyeonlim" }
]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.7.0",
    "httpx>=0.28.1",
    "openai>=3.48.0",
]

[project.scripts]
monday-scaries = "monday_scaries.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 80
[tool.ruff.lint]
select = ["E", "F", "I", "D", "UP", "B"]
[tool.ruff.lint.pydocstyle]
convention = "google"